version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: ecommerce_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  hbase:
    image: harisekhon/hbase:latest
    container_name: ecommerce_hbase
    ports:
      - "16010:16010"
      - "9090:9090"
      - "2181:2181"

  jupyter-spark:
    image: jupyter/pyspark-notebook:latest
    container_name: ecommerce_jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes

volumes:
  mongo_data:
